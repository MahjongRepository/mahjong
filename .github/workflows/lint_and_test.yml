name: Linters and tests

on:
  push:
    branches:
      - master
    paths:
      - mahjong/**
      - '**/*.py'
      - .pre-commit-config.yaml
      - pyproject.toml
      - uv.lock
      - Makefile
      - .github/workflows/lint_and_test.yml
  pull_request:
    branches:
      - master
    paths:
      - mahjong/**
      - '**/*.py'
      - .pre-commit-config.yaml
      - pyproject.toml
      - uv.lock
      - Makefile
      - .github/workflows/lint_and_test.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"

      - name: Install libs
        run: uv sync --locked --no-default-groups --group hooks --no-install-project

      - name: Run pre-commit hooks
        run: uv run --no-sync prek run --all-files

  tests:
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
          - "pypy3.10"
          - "pypy3.11"
          - "pypy3.12"
          - "graalpy3.10"
          - "graalpy3.11"
          - "graalpy3.12"
          - "graalpy3.13"
        include:
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libs
        if: matrix.python-version != 'graalpy3.10'
        run: uv sync --locked --no-default-groups --group test

      # GraalPy 24.0 expects a different pyvenv.cfg home than uv generates.
      # Use its standard venv and pip, including for isolated builds.
      - name: Install libs with GraalPy 3.10 workaround
        if: matrix.python-version == 'graalpy3.10'
        run: |
          uv python install graalpy3.10
          "$(uv python find graalpy3.10)" -m venv .venv
          uv export --locked --no-default-groups --group test --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements-test.txt"
          .venv/bin/python -m pip install -r "$RUNNER_TEMP/requirements-test.txt" -e .

      - name: Test with python ${{ matrix.python-version }}
        if: ${{ !startsWith(matrix.python-version, 'graalpy') }}
        run: uv run --no-sync pytest

      # coverage misidentifies executed lines on GraalPy, so run the full suite without coverage there.
      # Other interpreters still require 100% coverage.
      - name: Test with GraalPy 3.10 without coverage
        if: matrix.python-version == 'graalpy3.10'
        run: .venv/bin/python -m pytest --no-cov

      - name: Test with ${{ matrix.python-version }} without coverage
        if: startsWith(matrix.python-version, 'graalpy') && matrix.python-version != 'graalpy3.10'
        run: uv run --no-sync pytest --no-cov
