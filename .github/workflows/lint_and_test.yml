name: Linters and tests

on:
  push:
    paths:
      - mahjong/**
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"

      - name: Install libs
        run: uv sync --locked --no-default-groups --group lint --no-install-project

      - name: Lint files
        run: make lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"

      - name: Install libs
        run: uv sync --locked --no-default-groups --group typing --no-install-project

      - name: Check files
        run: make type

  tests:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "pypy3.10"
          - "pypy3.11"
          - "pypy3.12"
          - "graalpy3.10"
          - "graalpy3.11"
          - "graalpy3.12"
          - "graalpy3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libs
        if: matrix.python-version != 'graalpy3.10'
        run: uv sync --locked --no-default-groups --group test

      # GraalPy 24.0 expects a different pyvenv.cfg home than uv generates.
      # Use its standard venv and pip, including for isolated builds.
      - name: Install libs with GraalPy 3.10 workaround
        if: matrix.python-version == 'graalpy3.10'
        run: |
          uv python install graalpy3.10
          "$(uv python find graalpy3.10)" -m venv .venv
          uv export --locked --no-default-groups --group test --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements-test.txt"
          .venv/bin/python -m pip install -r "$RUNNER_TEMP/requirements-test.txt" -e .

      - name: Test with python ${{ matrix.python-version }}
        if: matrix.python-version != 'graalpy3.10' && matrix.python-version != 'graalpy3.12'
        run: make tests

      - name: Test with GraalPy 3.10
        if: matrix.python-version == 'graalpy3.10'
        run: .venv/bin/python -m pytest

      # coverage 7.16.2's PUSH_EXC_INFO filter misidentifies executed lines on GraalPy 3.12.
      # Run the full suite without coverage here; other interpreters still require 100% coverage.
      - name: Test with GraalPy 3.12 without coverage
        if: matrix.python-version == 'graalpy3.12'
        run: uv run --no-sync pytest --no-cov
