name: Build and check distributions

on:
  push:
    branches: [master]
    paths:
      - mahjong/**
      - pyproject.toml
      - uv.lock
      - MANIFEST.in
      - README.md
      - LICENSE.txt
      - scripts/check_distribution.py
      - .github/workflows/check_package.yml
  pull_request:
    branches: [master]
    paths:
      - mahjong/**
      - pyproject.toml
      - uv.lock
      - MANIFEST.in
      - README.md
      - LICENSE.txt
      - scripts/check_distribution.py
      - .github/workflows/check_package.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      artifact-id:
        description: 'Immutable ID of the built distributions in this run'
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
      package-version: ${{ steps.package.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Builds the wheel from the sdist, checks its contents and PyPI metadata,
      # and uploads the distributions for the installation checks and review.
      - name: Build and inspect distributions
        id: package
        uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          upload-name-suffix: -${{ github.run_attempt }}

      - name: Keep distributions by immutable artifact ID
        id: distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-distributions-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.dist }}/*.whl
            ${{ steps.package.outputs.dist }}/*.tar.gz
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        format: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv and the minimum supported Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/packages

      - name: Check an isolated installation
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          DISTRIBUTION_FORMAT: ${{ matrix.format }}
          EXPECTED_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          case "$DISTRIBUTION_FORMAT" in
            wheel) distributions=(packages/*.whl) ;;
            sdist) distributions=(packages/*.tar.gz) ;;
          esac
          test "${#distributions[@]}" -eq 1
          uv run --isolated --no-project --with "${distributions[0]}" \
            python -I "$GITHUB_WORKSPACE/scripts/check_distribution.py" "$EXPECTED_VERSION"
