name: Release

on:
  push:
    branches: [master]
    paths: [pyproject.toml]
  # Dispatch is ALWAYS a dry-run, including on upstream. Production starts only on merge.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'
          enable-cache: false

      - name: Identify the release and reviewed notes
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then args=(--base "$BEFORE"); fi
          uv run --no-project python scripts/release.py verify "${args[@]}"

  checks:
    if: needs.identify.outputs.release == 'true'
    needs: identify
    permissions:
      contents: read
    uses: ./.github/workflows/lint_and_test.yml # zizmor: ignore[self-repository] -- pinned actionlint does not support $/ yet
    with:
      ref: ${{ needs.identify.outputs.sha }}

  docs:
    if: needs.identify.outputs.release == 'true'
    needs: identify
    permissions:
      contents: read
    uses: ./.github/workflows/build_docs.yml # zizmor: ignore[self-repository] -- pinned actionlint does not support $/ yet
    with:
      ref: ${{ needs.identify.outputs.sha }}

  distributions:
    if: needs.identify.outputs.release == 'true'
    needs: identify
    permissions:
      contents: read
    uses: ./.github/workflows/check_package.yml # zizmor: ignore[self-repository] -- pinned actionlint does not support $/ yet
    with:
      ref: ${{ needs.identify.outputs.sha }}

  publish:
    if: >-
      needs.identify.outputs.release == 'true' &&
      github.repository == 'MahjongRepository/mahjong' &&
      github.event_name == 'push'
    needs: [identify, checks, docs, distributions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mahjong/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.distributions.outputs.artifact-id }}
          path: dist
          merge-multiple: true

      - name: Read the reviewed release notes
        run: uv run --no-project python scripts/release.py verify

      - name: Create the version tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identify.outputs.tag }}
          SHA: ${{ needs.identify.outputs.sha }}
        run: |
          gh auth setup-git
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish validated distributions to PyPI
        run: uv publish --trusted-publishing always dist/*

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identify.outputs.tag }}
          PRERELEASE: ${{ needs.identify.outputs.prerelease }}
        run: |
          args=(--latest)
          if [[ "$PRERELEASE" == true ]]; then args=(--prerelease --latest=false); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file release-notes.md "${args[@]}" dist/*
